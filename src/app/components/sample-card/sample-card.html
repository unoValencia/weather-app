<!-- Metric Switch (Outside Card) -->
<div class="metric-switch-container">
    <div class="metric-switch">
        <button 
            class="switch-btn" 
            [class.active]="isMetric()"
            (click)="setMetric(true)"
            type="button">
            °C
        </button>
        <button 
            class="switch-btn" 
            [class.active]="!isMetric()"
            (click)="setMetric(false)"
            type="button">
            °F
        </button>
    </div>
</div>

<!-- Weather Card -->
<div class="card">
    <div class="card-header">
        <h2>{{ weatherData()?.name }}</h2>
    </div>
    <div class="card-body">
        <p><strong>Temperature:</strong> {{ getTemperature() }}{{ isMetric() ? '°C' : '°F' }}</p>
        <p><strong>Humidity:</strong> {{ weatherData()?.main?.humidity }}%</p>
        <p><strong>Wind Speed:</strong> {{ getWindSpeed() }} {{ isMetric() ? 'km/h' : 'mph' }}</p>
    </div>
</div>
