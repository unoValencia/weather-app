@if (isBrowser()) {
<div class="search-container">
  <div class="search-wrapper">
    <div class="input-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="search-icon">
        <path fill-rule="evenodd"
          d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z"
          clip-rule="evenodd" />
      </svg>
      <input type="text" [value]="searchQuery()" (input)="onInputChange($event)" (keydown.enter)="onSearch()"
        placeholder="Search for your city"
        class="search-input" />
    </div>

    <button type="button" (click)="onSearch()" [disabled]="!searchQuery().trim()"
      class="search-button">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="button-icon">
        <path fill-rule="evenodd"
          d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z"
          clip-rule="evenodd" />
      </svg>
      <span>Search</span>
    </button>
  </div>
</div>
}
